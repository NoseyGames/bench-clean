name: Windows checks and portable build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py system.py storage.py
      - run: node --check web/app.js
      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name BenchClean --add-data "web;web" --add-data "scripts;scripts" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BenchClean-Windows-x64
          path: dist/BenchClean.exe
